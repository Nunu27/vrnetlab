name: "Build and Publish RouterOS Multi-Platform"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "mikrotik/routeros/**"
      - "common/**"
      - "vrnetlab-base.dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-routeros.yml"
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: vr-routeros

jobs:
  build-base:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: vrnetlab-base.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nunu27/vrnetlab/base:latest
          cache-from: type=gha,scope=vrnetlab-base
          cache-to: type=gha,mode=max,scope=vrnetlab-base

  build-and-push:
    runs-on: ubuntu-22.04
    needs: build-base
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            image_url: https://download.mikrotik.com/routeros/7.22.1/chr-7.22.1.vmdk.zip
            image_file: chr-7.22.1.vmdk
            tag_suffix: amd64
          - platform: linux/arm64
            image_url: https://download.mikrotik.com/routeros/7.22.1/chr-7.22.1-arm64.vdi.zip
            image_file: chr-7.22.1-arm64.vdi
            tag_suffix: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repository
        id: repo
        run: echo "IMAGE_REPOSITORY=$(echo "${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        run: |
          cd mikrotik/routeros
          wget "${{ matrix.image_url }}"
          unzip "$(basename "${{ matrix.image_url }}")"
          cp ../../common/*.py docker/
          cp "${{ matrix.image_file }}" docker/
          rm "$(basename "${{ matrix.image_url }}")" "${{ matrix.image_file }}"
          ls -la docker

      - name: Build and push Docker image (${{ matrix.tag_suffix }})
        uses: docker/build-push-action@v5
        with:
          context: ./mikrotik/routeros/docker
          file: ./mikrotik/routeros/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            IMAGE=${{ matrix.image_file }}
          tags: |
            ${{ steps.repo.outputs.IMAGE_REPOSITORY }}:${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=Dockerfile
          cache-to: type=gha,mode=max,scope=Dockerfile

  test:
    runs-on: ${{ matrix.runs-on }}
    needs: build-and-push
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag_suffix: amd64
            runs-on: ubuntu-22.04
          - tag_suffix: arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repository
        id: repo
        run: echo "IMAGE_REPOSITORY=$(echo "${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: Enable KVM device access (best-effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "::warning::/dev/kvm not present on this runner; mikrotik_ros needs it and will fail to deploy"

      - name: Write test topology
        run: |
          cat > topo.clab.yml <<EOF
          name: citest
          topology:
            nodes:
              r1:
                kind: mikrotik_ros
                image: ${{ steps.repo.outputs.IMAGE_REPOSITORY }}:${{ matrix.tag_suffix }}
          EOF

      - name: Deploy topology
        run: sudo containerlab deploy -t topo.clab.yml

      - name: Wait for first boot to report healthy
        run: |
          deadline=$((SECONDS + 600))
          status=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(sudo docker inspect --format '{{.State.Health.Status}}' clab-citest-r1 2>/dev/null || echo "unknown")
            echo "[${SECONDS}s] health: $status"
            [ "$status" = "healthy" ] && break
            sleep 10
          done
          if [ "$status" != "healthy" ]; then
            echo "::error::r1 never became healthy on first boot (status: $status)"
            exit 1
          fi

      # Regression test for the bug where a node's identity, once set away from the
      # default on first boot, makes vrnetlab's login-prompt matcher fail on every
      # subsequent boot and the node gets stuck unhealthy forever. Use the same
      # `containerlab restart --node` command vlab's own auto-heal uses in production
      # (packages/@vlab/clab/src/containerlab.ts, redeployNode) rather than a bare
      # `docker restart`, since that's the actual code path this is meant to guard.
      - name: Restart node and confirm it recovers
        run: |
          sudo containerlab restart --topo topo.clab.yml --node r1
          deadline=$((SECONDS + 600))
          status=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(sudo docker inspect --format '{{.State.Health.Status}}' clab-citest-r1 2>/dev/null || echo "unknown")
            echo "[${SECONDS}s] health: $status"
            [ "$status" = "healthy" ] && break
            sleep 10
          done
          if [ "$status" != "healthy" ]; then
            echo "::error::r1 never recovered after restart (status: $status)"
            exit 1
          fi

      - name: Dump node logs on failure
        if: failure()
        run: sudo docker logs clab-citest-r1 || true

      - name: Destroy topology
        if: always()
        run: sudo containerlab destroy -t topo.clab.yml --cleanup || true

  publish-manifest:
    runs-on: ubuntu-22.04
    needs: [build-and-push, test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repository
        id: repo
        run: echo "IMAGE_REPOSITORY=$(echo "${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.repo.outputs.IMAGE_REPOSITORY }}:latest" \
            "${{ steps.repo.outputs.IMAGE_REPOSITORY }}:amd64" \
            "${{ steps.repo.outputs.IMAGE_REPOSITORY }}:arm64"
