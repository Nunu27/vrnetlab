name: "Build and Publish RouterOS Multi-Platform"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "mikrotik/routeros/**"
      - "common/**"
      - "vrnetlab-base.dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-routeros.yml"
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: vr-routeros

jobs:
  build-base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            safe_platform: linux-amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            safe_platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch base image digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: vrnetlab-base.dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/nunu27/vrnetlab/base,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=vrnetlab-base-${{ matrix.safe_platform }}
          cache-to: type=gha,mode=max,scope=vrnetlab-base-${{ matrix.safe_platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ matrix.safe_platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-base:
    runs-on: ubuntu-22.04
    needs: build-base
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-base-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t ghcr.io/nunu27/vrnetlab/base:latest \
            $(printf "ghcr.io/nunu27/vrnetlab/base@sha256:%s " *)

  build-and-push:
    needs: merge-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            safe_platform: linux-amd64
            runner: ubuntu-22.04
            image_url: https://download.mikrotik.com/routeros/7.22.1/chr-7.22.1.vmdk.zip
            image_file: chr-7.22.1.vmdk
            tag_suffix: amd64
          - platform: linux/arm64
            safe_platform: linux-arm64
            runner: ubuntu-24.04-arm
            image_url: https://download.mikrotik.com/routeros/7.22.1/chr-7.22.1-arm64.vdi.zip
            image_file: chr-7.22.1-arm64.vdi
            tag_suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repository
        id: repo
        run: echo "IMAGE_REPOSITORY=$(echo "${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        run: |
          cd mikrotik/routeros
          wget "${{ matrix.image_url }}"
          unzip "$(basename "${{ matrix.image_url }}")"
          cp ../../common/*.py docker/
          cp "${{ matrix.image_file }}" docker/
          rm "$(basename "${{ matrix.image_url }}")" "${{ matrix.image_file }}"
          ls -la docker

      - name: Build and push Docker image digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./mikrotik/routeros/docker
          file: ./mikrotik/routeros/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.repo.outputs.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IMAGE=${{ matrix.image_file }}
          cache-from: type=gha,scope=Dockerfile-${{ matrix.safe_platform }}
          cache-to: type=gha,mode=max,scope=Dockerfile-${{ matrix.safe_platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-routeros-${{ matrix.safe_platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    runs-on: ubuntu-22.04
    needs: build-and-push
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repository
        id: repo
        run: echo "IMAGE_REPOSITORY=$(echo "${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-routeros-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.repo.outputs.IMAGE_REPOSITORY }}:latest" \
            --tag "${{ steps.repo.outputs.IMAGE_REPOSITORY }}:amd64" \
            --tag "${{ steps.repo.outputs.IMAGE_REPOSITORY }}:arm64" \
            $(printf "${{ steps.repo.outputs.IMAGE_REPOSITORY }}@sha256:%s " *)
